
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Password Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.8;
        }

        .app-container {
            display: flex;
            height: 500px;
        }

        .main-content {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: relative; /* For sliding effect */
            overflow: hidden; /* Hide overflow during slide */
        }

        .content-section {
            width: 100%;
            flex-shrink: 0; /* Prevent sections from shrinking */
            transition: transform 0.5s ease-in-out; /* Sliding animation */
        }

        .tools-panel {
            width: 60px;
            background: #34495e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: relative; /* For popup positioning */
            z-index: 10; /* Ensure tools panel is above content during slide */
        }

        .tool-icon {
            color: white;
            font-size: 24px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .tool-icon.active {
            color: #3498db;
            transform: scale(1.2);
        }

        .tool-icon:hover {
            transform: scale(1.2);
        }

        .tool-icon .tooltip {
            position: absolute;
            left: -140px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(52, 73, 94, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 130px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            pointer-events: none;
            text-align: center;
        }

        .tool-icon:hover .tooltip {
            opacity: 1;
            visibility: visible;
            left: -150px;
        }

        .generator-section, .history-section, .settings-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            flex: 1; /* Allow sections to take full height */
            display: flex;
            flex-direction: column;
        }

        .settings-section {
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #555;
            text-align: center;
        }

        .password-display {
            display: flex;
            margin-bottom: 20px;
        }

        .password-display input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px 0 0 8px;
            font-size: 18px;
            outline: none;
        }

        .password-display button {
            padding: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: background 0.3s;
            min-width: 50px; /* Ensure button doesn't shrink too much */
        }

        .password-display button:hover {
            background: #2980b9;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
        }

        .option input {
            margin-right: 10px;
        }

        .slider-container {
            margin: 20px 0;
        }

        .slider-container p {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .slider {
            width: 100%;
            height: 10px;
        }

        .generate-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .generate-btn:hover {
            background: #27ae60;
        }

        .history-section h2 {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .history-list {
            flex: 1; /* Allow history list to expand */
            max-height: 100%; /* Limit height for scrollability */
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: #f9f9f9;
        }

        .history-info {
            display: flex;
            align-items: center;
            flex-grow: 1;
            word-break: break-all;
            margin-right: 10px;
        }

        .history-info img {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .history-password {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            font-size: 16px;
            letter-spacing: 0.5px;
            margin-right: 5px;
        }

        .history-site {
            font-size: 12px;
            color: #888;
        }

        .history-actions {
            display: flex;
            gap: 5px;
        }

        .history-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #7f8c8d;
            transition: color 0.3s;
            padding: 5px;
        }

        .history-actions button:hover {
            color: #3498db;
        }

        .account-popup {
            display: none;
            position: fixed; /* Changed to fixed for better positioning over content */
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            width: 320px;
            max-width: 90vw; /* Responsive width */
            z-index: 100;
            overflow: hidden;
            top: 50%; /* Center vertically */
            left: 50%; /* Center horizontally */
            transform: translate(-50%, -50%); /* Adjust for centering */
        }

        .account-header {
            background: #3498db;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-header .fas.fa-times {
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.3s;
        }

        .account-header .fas.fa-times:hover {
            transform: rotate(90deg);
        }

        .account-content {
            padding: 20px;
        }

        .account-field {
            margin-bottom: 15px;
        }

        .account-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #7f8c8d;
        }

        .account-field input, .account-field textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .account-field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .account-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #eee;
        }

        .account-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-save {
            background: #2ecc71;
            color: white;
            transition: background 0.3s;
        }

        .btn-save:hover {
            background: #27ae60;
        }

        .btn-cancel {
            background: #e74c3c;
            color: white;
            transition: background 0.3s;
        }

        .btn-cancel:hover {
            background: #c0392b;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: auto;
            }
            
            .tools-panel {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                padding: 10px 0;
            }
            
            .tool-icon {
                margin: 0 10px;
            }
            
            .tool-icon .tooltip {
                left: 50%;
                top: -40px;
                transform: translateX(-50%);
                width: max-content;
                white-space: nowrap; /* Prevent tooltip from breaking */
            }
            
            .tool-icon:hover .tooltip {
                left: 50%;
                top: -50px;
            }
            
            .options {
                grid-template-columns: 1fr;
            }

            .account-popup {
                width: 95vw; /* Even wider on small screens */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Advanced Password Generator</h1>
            <p>Create strong passwords and manage them with ease</p>
        </header>
        
        <div class="app-container">
            <div class="main-content">
                <!-- Content sections for sliding -->
                <div class="content-section" id="generator-content">
                    <div class="generator-section">
                        <div class="password-display">
                            <input type="text" id="password" placeholder="Your password will appear here" readonly>
                            <button id="copy-btn"><i class="fas fa-copy"></i></button>
                        </div>
                        
                        <div class="slider-container">
                            <p>
                                <span>Password Length:</span>
                                <span id="length-value">12</span>
                            </p>
                            <input type="range" id="length-slider" class="slider" min="6" max="30" value="12">
                        </div>
                        
                        <div class="options">
                            <div class="option">
                                <input type="checkbox" id="uppercase" checked>
                                <label for="uppercase">Uppercase (A-Z)</label>
                            </div>
                            <div class="option">
                                <input type="checkbox" id="lowercase" checked>
                                <label for="lowercase">Lowercase (a-z)</label>
                            </div>
                            <div class="option">
                                <input type="checkbox" id="numbers" checked>
                                <label for="numbers">Numbers (0-9)</label>
                            </div>
                            <div class="option">
                                <input type="checkbox" id="symbols">
                                <label for="symbols">Symbols (!@#$)</label>
                            </div>
                        </div>
                        
                        <button id="generate-btn" class="generate-btn">Generate Password</button>
                    </div>
                </div>
                
                <div class="content-section" id="history-content" style="display: none;">
                    <div class="history-section">
                        <h2>Password History</h2>
                        <div id="history-list" class="history-list">
                            <!-- History items will be added here -->
                        </div>
                    </div>
                </div>

                <div class="content-section" id="settings-content" style="display: none;">
                    <div class="settings-section">
                        <i class="fas fa-cog fa-spin fa-3x" style="margin-bottom: 20px;"></i>
                        <p>Settings will be implemented here soon!</p>
                        <p style="font-size: 16px; color: #777;">Customize your generator and preferences.</p>
                    </div>
                </div>
            </div>
            
            <div class="tools-panel">
                <div class="tool-icon" id="generator-tool">
                    <i class="fas fa-key"></i>
                    <div class="tooltip">Password Generator</div>
                </div>
                <div class="tool-icon" id="history-tool">
                    <i class="fas fa-history"></i>
                    <div class="tooltip">Password History</div>
                </div>
                <div class="tool-icon" id="add-tool">
                    <i class="fas fa-plus"></i>
                    <div class="tooltip">Add Account</div>
                </div>
                <div class="tool-icon active" id="settings-tool">
                    <i class="fas fa-cog"></i>
                    <div class="tooltip">Settings</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="account-popup" id="account-popup">
        <div class="account-header">
            <h3>Add Account</h3>
            <i class="fas fa-times" id="close-popup"></i>
        </div>
        <div class="account-content">
            <div class="account-field">
                <label for="account-username">Username</label>
                <input type="text" id="account-username" placeholder="Enter username">
            </div>
            <div class="account-field">
                <label for="account-password">Password</label>
                <input type="text" id="account-password" placeholder="Enter password">
                <!-- Added a button to generate password directly in account form -->
                <button type="button" class="generate-in-popup-btn" style="width: 100%; margin-top: 10px; padding: 8px; background-color: #5cb85c; color: white; border: none; border-radius: 5px; cursor: pointer;">Generate Password</button>
            </div>
            <div class="account-field">
                <label for="account-site">Site URL</label>
                <input type="text" id="account-site" placeholder="e.g. web.facebook.com">
            </div>
            <div class="account-field">
                <label for="account-note">Note (Optional)</label>
                <textarea id="account-note" placeholder="Add a note about this account"></textarea>
            </div>
        </div>
        <div class="account-actions">
            <button class="btn-cancel" id="cancel-account">Cancel</button>
            <button class="btn-save" id="save-account">Save</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const passwordInput = document.getElementById('password');
            const lengthSlider = document.getElementById('length-slider');
            const lengthValue = document.getElementById('length-value');
            const generateBtn = document.getElementById('generate-btn');
            const copyBtn = document.getElementById('copy-btn');
            const historyList = document.getElementById('history-list');
            const accountPopup = document.getElementById('account-popup');
            const addTool = document.getElementById('add-tool');
            const generatorTool = document.getElementById('generator-tool');
            const historyTool = document.getElementById('history-tool');
            const settingsTool = document.getElementById('settings-tool');
            const closePopup = document.getElementById('close-popup');
            const cancelAccount = document.getElementById('cancel-account');
            const saveAccount = document.getElementById('save-account');
            
            const generatorContent = document.getElementById('generator-content');
            const historyContent = document.getElementById('history-content');
            const settingsContent = document.getElementById('settings-content');

            const accountUsernameInput = document.getElementById('account-username');
            const accountPasswordInput = document.getElementById('account-password');
            const accountSiteInput = document.getElementById('account-site');
            const accountNoteInput = document.getElementById('account-note');
            const generateInPopupBtn = document.querySelector('.generate-in-popup-btn');

            // Character sets
            const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
            const numberChars = '0123456789';
            const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            // Function to update active tool icon and content visibility with sliding effect
            function updateActiveTool(toolId) {
                document.querySelectorAll('.tool-icon').forEach(icon => {
                    icon.classList.remove('active');
                });
                document.getElementById(toolId).classList.add('active');

                // Hide all content sections initially for consistent display logic
                generatorContent.style.display = 'none';
                historyContent.style.display = 'none';
                settingsContent.style.display = 'none';

                // Determine which content section to show based on the toolId
                let targetContent;
                if (toolId === 'generator-tool') {
                    targetContent = generatorContent;
                } else if (toolId === 'history-tool') {
                    targetContent = historyContent;
                } else if (toolId === 'settings-tool') {
                    targetContent = settingsContent;
                }

                if (targetContent) {
                    targetContent.style.display = 'flex'; // Ensure flex for content sections
                }
            }

            // Event listeners for tool icons
            generatorTool.addEventListener('click', () => updateActiveTool('generator-tool'));
            historyTool.addEventListener('click', () => updateActiveTool('history-tool'));
            settingsTool.addEventListener('click', () => {
                updateActiveTool('settings-tool');
            });
            
            // Update length value display
            lengthSlider.addEventListener('input', function() {
                lengthValue.textContent = lengthSlider.value;
            });
            
            // Generate password
            generateBtn.addEventListener('click', function() {
                const password = generatePasswordFromOptions();
                if (password) {
                    passwordInput.value = password;
                    addToHistory(password, null, null); // Add to history without account details
                }
            });

            // Generate password inside account popup
            generateInPopupBtn.addEventListener('click', function() {
                const length = 16; 
                const includeUppercase = true;
                const includeLowercase = true;
                const includeNumbers = true;
                const includeSymbols = true;

                const generatedPwd = generatePassword(length, includeUppercase, includeLowercase, includeNumbers, includeSymbols);
                if (generatedPwd) {
                    accountPasswordInput.value = generatedPwd;
                }
            });
            
            // Copy password to clipboard
            copyBtn.addEventListener('click', function() {
                if (passwordInput.value) {
                    navigator.clipboard.writeText(passwordInput.value).then(() => {
                        copyBtn.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => {
                            copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy password: ', err);
                        alert('Failed to copy password to clipboard.');
                    });
                }
            });
            
            // Show account popup
            addTool.addEventListener('click', function() {
                accountPopup.style.display = 'block';
                // No change to active tool, as popup is overlay
            });
            
            // Close account popup
            closePopup.addEventListener('click', closeAccountPopup);
            cancelAccount.addEventListener('click', closeAccountPopup);
            
            // Save account
            saveAccount.addEventListener('click', function() {
                const username = accountUsernameInput.value;
                const password = accountPasswordInput.value;
                const site = accountSiteInput.value;
                const note = accountNoteInput.value;
                
                if (username && password && site) {
                    // Add to password history with account details
                    addToHistory(password, site, username); 
                    
                    alert(`Account for "${site}" saved!\nUsername: ${username}`);
                    closeAccountPopup();
                    
                    // Clear the form
                    accountUsernameInput.value = '';
                    accountPasswordInput.value = '';
                    accountSiteInput.value = '';
                    accountNoteInput.value = '';

                    // Switch to history after saving account
                    updateActiveTool('history-tool');
                } else {
                    alert('Please fill in all required fields (Username, Password, and Site)');
                }
            });
            
            // Password generation function
            function generatePassword(length, upper, lower, numbers, symbols) {
                let chars = '';
                if (upper) chars += uppercaseChars;
                if (lower) chars += lowercaseChars;
                if (numbers) chars += numberChars;
                if (symbols) chars += symbolChars;
                
                if (chars === '') {
                    alert('Please select at least one character type');
                    return '';
                }
                
                let password = '';
                for (let i = 0; i < length; i++) {
                    const randomIndex = Math.floor(Math.random() * chars.length);
                    password += chars[randomIndex];
                }
                
                return password;
            }

            // Helper function to generate password based on current UI options
            function generatePasswordFromOptions() {
                const length = parseInt(lengthSlider.value);
                const includeUppercase = document.getElementById('uppercase').checked;
                const includeLowercase = document.getElementById('lowercase').checked;
                const includeNumbers = document.getElementById('numbers').checked;
                const includeSymbols = document.getElementById('symbols').checked;
                return generatePassword(length, includeUppercase, includeLowercase, includeNumbers, includeSymbols);
            }
            
            // Add password to history
            function addToHistory(password, site = null, username = null) {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                let faviconHtml = '';
                let displaySite = '';

                if (site) {
                    try {
                        const url = new URL(site.startsWith('http') ? site : `https://${site}`);
                        faviconHtml = `<img src="https://www.google.com/s2/favicons?domain=${url.hostname}&sz=16" alt="Favicon" onerror="this.style.display='none';">`;
                        displaySite = url.hostname;
                    } catch (e) {
                        console.error("Invalid URL for favicon:", site, e);
                        displaySite = site; // Fallback to raw site if URL is invalid
                    }
                }
                
                historyItem.innerHTML = `
                    <div class="history-info">
                        ${faviconHtml}
                        <div>
                            <div class="history-password">${password}</div>
                            ${site ? `<div class="history-site">${displaySite} ${username ? `(${username})` : ''}</div>` : ''}
                        </div>
                    </div>
                    <div class="history-actions">
                        <button class="use-btn" title="Use Password"><i class="fas fa-redo"></i></button>
                        <button class="copy-history-btn" title="Copy Password"><i class="fas fa-copy"></i></button>
                        <button class="delete-btn" title="Delete Entry"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                
                // Add event listeners for the buttons
                historyItem.querySelector('.use-btn').addEventListener('click', function() {
                    passwordInput.value = password;
                    updateActiveTool('generator-tool'); // Switch to generator section
                });

                historyItem.querySelector('.copy-history-btn').addEventListener('click', function() {
                    navigator.clipboard.writeText(password).then(() => {
                        const originalIcon = this.innerHTML;
                        this.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => {
                            this.innerHTML = originalIcon;
                        }, 1500);
                    }).catch(err => {
                        console.error('Failed to copy password: ', err);
                        alert('Failed to copy password to clipboard.');
                    });
                });
                
                historyItem.querySelector('.delete-btn').addEventListener('click', function() {
                    historyItem.remove();
                });
                
                historyList.insertBefore(historyItem, historyList.firstChild);
            }
            
            // Close account popup
            function closeAccountPopup() {
                accountPopup.style.display = 'none';
                // No change to active tool, as popup is overlay
            }
            
            // Generate a password on load and add to history
            const initialPassword = generatePasswordFromOptions();
            if (initialPassword) {
                passwordInput.value = initialPassword;
                addToHistory(initialPassword, null, null);
            }

            // Initialize active tool display (Settings is now default)
            updateActiveTool('settings-tool');
        });
    </script>
</body>
</html>
